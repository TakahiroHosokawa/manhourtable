<script>
// サーバ呼び出しラッパー
function callServer(funcName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        let parsed = res;
        if (typeof res === 'string') {
          try { parsed = JSON.parse(res); } catch (e) {}
        }
        if (parsed && parsed.ok !== undefined && !parsed.ok) {
          showStatus('エラー: ' + parsed.message, true);
          reject(parsed);
        } else {
          resolve(parsed);
        }
      })
      .withFailureHandler(err => {
        showStatus('通信エラー: ' + err.message, true);
        reject(err);
      })
      [funcName](...args);
  });
}

function showStatus(msg, isError = false) {
  const el = document.getElementById('status-message');
  el.textContent = msg;
  el.style.color = isError ? '#ff7b7b' : '#ffeb3b';
  
  // 画面中央のローディングオーバーレイ制御
  const overlay = document.getElementById('loading-overlay');
  const overlayMsg = document.getElementById('loading-message');
  
  if (overlay) {
    if (msg && !isError && msg.endsWith('...')) {
      overlayMsg.textContent = msg;
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
    }
  }

  if (!isError && msg && !msg.endsWith('...')) {
    setTimeout(() => { el.textContent = ''; }, 3000);
  }
}
</script>
<script>
// 5.9 の固定選択肢（アプリ固定。選択肢シートでは管理しない）
const OPTIONS = {
  '区分': ['実作業', '付随作業', '加工作業', '運搬', '手待ち', '段取り', '間接作業'],
  '作業方式': ['人手', '人手＋工具・治具', '機械操作', '機械自動（人は離れられる）', '機械自動・監視要', '自動搬送'],
  '単位': ['台', '便', '日'],
  '時間方式': ['分担作業', '同時作業'],
  '数量方式': ['固定', 'パラメータ', '部品の使用数'],
  '確度': ['未観測', '暫定', '確定'],
  '中断可否': ['中断可', '中断不可'],
  '占有方式': ['専有', '共有']
};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 選択肢を組み立てる。現在値が一覧に無い場合も選択肢として残す（保存時の値の取り違えを防ぐ）
function buildSelect(name, list, current, isDisabled = false) {
  const cur = current == null ? '' : String(current);
  const items = list.slice();
  if (cur !== '' && items.indexOf(cur) === -1) items.push(cur);
  const opts = items.map(v =>
    `<option value="${escapeHtml(v)}"${v === cur ? ' selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `<select name="${name}" class="edit-input" ${isDisabled ? 'disabled' : ''}>${opts}</select>`;
}

// タブ切り替え処理
document.addEventListener('DOMContentLoaded', () => {
  const tabWorks = document.getElementById('tab-works');
  const tabSummary = document.getElementById('tab-summary');
  const tabMaster = document.getElementById('tab-master');
  const tabProduct = document.getElementById('tab-product');
  const tabParts = document.getElementById('tab-parts');
  const tabVersion = document.getElementById('tab-version');
  
  const viewWorks = document.getElementById('works-view');
  const viewSummary = document.getElementById('summary-view');
  const viewMaster = document.getElementById('master-view');
  const viewProduct = document.getElementById('product-view');
  const viewParts = document.getElementById('parts-view');
  const viewVersion = document.getElementById('version-view');

  if (tabWorks && tabSummary && tabMaster && tabProduct && tabParts && tabVersion) {
    const hideAll = () => {
      [tabWorks, tabSummary, tabMaster, tabProduct, tabParts, tabVersion].forEach(t => t.classList.remove('active'));
      [viewWorks, viewSummary, viewMaster, viewProduct, viewParts, viewVersion].forEach(v => {
        if (v) v.style.display = 'none';
      });
    };

    tabWorks.addEventListener('click', () => {
      hideAll();
      tabWorks.classList.add('active');
      viewWorks.style.display = 'block';
    });

    tabSummary.addEventListener('click', () => {
      hideAll();
      tabSummary.classList.add('active');
      viewSummary.style.display = 'block';
      if (typeof renderSummary === 'function') renderSummary();
    });

    tabMaster.addEventListener('click', () => {
      hideAll();
      tabMaster.classList.add('active');
      viewMaster.style.display = 'block';
      if (typeof renderMaster === 'function') renderMaster();
    });
    
    tabProduct.addEventListener('click', () => {
      hideAll();
      tabProduct.classList.add('active');
      viewProduct.style.display = 'block';
      if (typeof renderProductBlocks === 'function') renderProductBlocks();
    });

    tabParts.addEventListener('click', () => {
      hideAll();
      tabParts.classList.add('active');
      viewParts.style.display = 'block';
      if (typeof renderPartsView === 'function') renderPartsView();
    });

    tabVersion.addEventListener('click', () => {
      hideAll();
      tabVersion.classList.add('active');
      viewVersion.style.display = 'block';
      if (typeof renderVersionView === 'function') renderVersionView();
    });
  }

  // 使い方ガイドの開閉処理
  const guideOpenBtn = document.getElementById('guide-open-btn');
  const guideModal = document.getElementById('guide-modal');
  const guideOverlay = document.getElementById('guide-overlay');
  const guideCloseBtn = document.getElementById('guide-close-btn');
  const guideCloseBtnBottom = document.getElementById('guide-close-btn-bottom');

  if (guideOpenBtn && guideModal && guideOverlay) {
    const openGuide = () => {
      guideOverlay.style.display = 'block';
      guideModal.style.display = 'block';
    };
    const closeGuide = () => {
      guideOverlay.style.display = 'none';
      guideModal.style.display = 'none';
    };
    
    guideOpenBtn.addEventListener('click', openGuide);
    guideCloseBtn.addEventListener('click', closeGuide);
    guideCloseBtnBottom.addEventListener('click', closeGuide);
    guideOverlay.addEventListener('click', closeGuide);
  }
});
</script>
