<!-- 部品・設備紐付け用のモーダルとロジック -->
<div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<div id="binding-modal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); width:600px; max-height:80%; background:#fff; z-index:1000; border-radius:8px; padding:20px; overflow-y:auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 id="modal-title" style="margin:0;">紐付け</h3>
    <button id="modal-close" style="background:none; border:none; font-size:1.5em; cursor:pointer;">&times;</button>
  </div>
  
  <div id="modal-content">
    <p>データを読み込んでいます...</p>
  </div>
  
  <div style="text-align:right; margin-top:20px;">
    <button id="modal-save-btn" class="btn-small" style="background:#2196F3; color:#fff; font-size:1em; padding:8px 16px;">保存</button>
  </div>
</div>

<script>
let currentBindingType = '';
let currentTargetId = '';
let bindingData = [];
let availableList = [];

// モーダルのDOM
const overlay = document.getElementById('modal-overlay');
const modal = document.getElementById('binding-modal');
const modalTitle = document.getElementById('modal-title');
const modalContent = document.getElementById('modal-content');
const btnClose = document.getElementById('modal-close');
const btnSave = document.getElementById('modal-save-btn');

btnClose.addEventListener('click', closeModal);
overlay.addEventListener('click', closeModal);

function closeModal() {
  overlay.style.display = 'none';
  modal.style.display = 'none';
}

function openModalBase(title) {
  modalTitle.textContent = title;
  modalContent.innerHTML = '<p>データを読み込んでいます...</p>';
  overlay.style.display = 'block';
  modal.style.display = 'block';
  btnSave.disabled = true;
  btnSave.textContent = '保存';
}

// ---------------------------
// 使用部品 (F26)
// ---------------------------
async function openPartsModal(detailId) {
  currentBindingType = 'parts';
  currentTargetId = detailId;
  openModalBase(`使用部品の紐付け (内訳ID: ${detailId})`);
  
  // 本来はサーバーから取得するが、モック的に作成
  // TODO: サーバーサイドに getUsageData('使用部品', detailId) を実装する
  const res = await callServer('getBindingData', 'parts', detailId);
  if (res.ok) {
    bindingData = res.data.used; // 現在紐付いている部品リスト [{品番, 使用数, 数量基準, 備考}]
    availableList = res.data.available; // 選択可能な部品リスト [{品番, 品名}]
    renderPartsModal();
  } else {
    modalContent.innerHTML = `<p style="color:red;">エラー: ${res.message}</p>`;
  }
}

function renderPartsModal() {
  let html = `
    <table style="width:100%; border-collapse:collapse; margin-bottom:15px;">
      <thead>
        <tr style="background:#f5f5f5;">
          <th style="padding:5px; border:1px solid #ccc;">品番</th>
          <th style="padding:5px; border:1px solid #ccc;">使用数/台</th>
          <th style="padding:5px; border:1px solid #ccc;">数量基準</th>
          <th style="padding:5px; border:1px solid #ccc;">操作</th>
        </tr>
      </thead>
      <tbody id="binding-tbody">
  `;
  
  bindingData.forEach((row, idx) => {
    html += `
      <tr data-idx="${idx}">
        <td style="padding:5px; border:1px solid #ccc;">
          ${buildAvailableSelect('品番', availableList, row['品番'], '品名')}
        </td>
        <td style="padding:5px; border:1px solid #ccc;"><input type="number" class="bind-input" name="使用数" value="${row['使用数']}" style="width:60px;"></td>
        <td style="padding:5px; border:1px solid #ccc; text-align:center;"><input type="radio" class="bind-input" name="数量基準" value="${idx}" ${row['数量基準'] ? 'checked' : ''}></td>
        <td style="padding:5px; border:1px solid #ccc; text-align:center;"><button class="btn-small remove-bind-btn" data-idx="${idx}">削除</button></td>
      </tr>
    `;
  });
  
  html += `
      </tbody>
    </table>
    <button id="add-bind-row-btn" class="btn-small">+ 部品を追加</button>
  `;
  
  modalContent.innerHTML = html;
  btnSave.disabled = false;
  
  // イベントバインド
  document.getElementById('add-bind-row-btn').addEventListener('click', () => {
    bindingData.push({ '品番': '', '使用数': 1, '数量基準': false, '備考': '' });
    renderPartsModal();
  });
  
  document.querySelectorAll('.remove-bind-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.target.dataset.idx;
      bindingData.splice(idx, 1);
      renderPartsModal();
    });
  });
}

// ---------------------------
// 使用設備 (F60)
// ---------------------------
async function openEquipModal(detailId, processId, groupId) {
  currentBindingType = 'equipment';
  currentTargetId = detailId;
  openModalBase(`使用設備の紐付け (内訳ID: ${detailId})`);
  
  const res = await callServer('getBindingData', 'equipment', detailId);
  if (res.ok) {
    bindingData = res.data.used; // [{設備ID, 必要台数, 占有方式, 備考}]
    availableList = res.data.available; // [{設備ID, 設備名, 保有台数}]
    renderEquipModal();
  } else {
    modalContent.innerHTML = `<p style="color:red;">エラー: ${res.message}</p>`;
  }
}

function renderEquipModal() {
  let html = `
    <table style="width:100%; border-collapse:collapse; margin-bottom:15px;">
      <thead>
        <tr style="background:#f5f5f5;">
          <th style="padding:5px; border:1px solid #ccc;">設備</th>
          <th style="padding:5px; border:1px solid #ccc;">必要台数</th>
          <th style="padding:5px; border:1px solid #ccc;">占有方式</th>
          <th style="padding:5px; border:1px solid #ccc;">操作</th>
        </tr>
      </thead>
      <tbody id="binding-tbody">
  `;
  
  bindingData.forEach((row, idx) => {
    html += `
      <tr data-idx="${idx}">
        <td style="padding:5px; border:1px solid #ccc;">
          ${buildAvailableSelect('設備ID', availableList, row['設備ID'], '設備名')}
        </td>
        <td style="padding:5px; border:1px solid #ccc;"><input type="number" class="bind-input" name="必要台数" value="${row['必要台数']}" style="width:60px;"></td>
        <td style="padding:5px; border:1px solid #ccc;">
           <select class="bind-input" name="占有方式">
             <option value="専有" ${row['占有方式'] === '専有' ? 'selected' : ''}>専有</option>
             <option value="共有" ${row['占有方式'] === '共有' ? 'selected' : ''}>共有</option>
           </select>
        </td>
        <td style="padding:5px; border:1px solid #ccc; text-align:center;"><button class="btn-small remove-bind-btn" data-idx="${idx}">削除</button></td>
      </tr>
    `;
  });
  
  html += `
      </tbody>
    </table>
    <button id="add-bind-row-btn" class="btn-small">+ 設備を追加</button>
  `;
  
  modalContent.innerHTML = html;
  btnSave.disabled = false;
  
  document.getElementById('add-bind-row-btn').addEventListener('click', () => {
    bindingData.push({ '設備ID': '', '必要台数': 1, '占有方式': '専有', '備考': '' });
    renderEquipModal();
  });
  
  document.querySelectorAll('.remove-bind-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.target.dataset.idx;
      bindingData.splice(idx, 1);
      renderEquipModal();
    });
  });
}

// ヘルパー：リストからセレクトボックスを生成
function buildAvailableSelect(name, list, currentVal, displayKey) {
  let opts = `<option value="">選択してください</option>`;
  list.forEach(item => {
    const val = escapeHtml(item[name]);
    const disp = escapeHtml(item[displayKey] || item[name]);
    const selected = (item[name] === currentVal) ? 'selected' : '';
    opts += `<option value="${val}" ${selected}>${disp}</option>`;
  });
  return `<select name="${name}" class="bind-input" style="max-width:150px;">${opts}</select>`;
}

// ---------------------------
// 保存処理
// ---------------------------
btnSave.addEventListener('click', async () => {
  btnSave.disabled = true;
  btnSave.textContent = '保存中...';
  
  // 画面の入力値を bindingData に反映
  const tbody = document.getElementById('binding-tbody');
  const rows = tbody.querySelectorAll('tr');
  const newData = [];
  
  let hasError = false;
  
  rows.forEach((tr, idx) => {
    const obj = {};
    tr.querySelectorAll('.bind-input').forEach(input => {
      if (input.type === 'radio') {
         obj[input.name] = input.checked;
      } else {
         obj[input.name] = input.type === 'number' ? Number(input.value) : input.value;
      }
    });
    
    // バリデーション
    if (currentBindingType === 'parts' && !obj['品番']) hasError = true;
    if (currentBindingType === 'equipment' && !obj['設備ID']) hasError = true;
    
    newData.push(obj);
  });
  
  if (hasError) {
    alert('品番/設備IDが選択されていない行があります。');
    btnSave.disabled = false;
    btnSave.textContent = '保存';
    return;
  }
  
  // 数量基準のチェック（部品の場合1つだけ）
  if (currentBindingType === 'parts') {
    const bases = newData.filter(r => r['数量基準']);
    if (bases.length > 1) {
      alert('数量基準は1つの作業内訳につき1部品までしか設定できません。');
      btnSave.disabled = false;
      btnSave.textContent = '保存';
      return;
    }
  }

  const res = await callServer('saveBindingData', currentBindingType, currentTargetId, newData);
  if (res.ok) {
    alert('保存しました');
    closeModal();
    // 画面の再描画（排他警告などを反映させるため）
    const reloadRes = await callServer('getAppData');
    if (reloadRes.ok) {
      appData = reloadRes.data;
      appData.params.forEach(p => paramMap[p['パラメータID']] = p['値']);
      renderTable();
    }
  } else {
    alert('エラー: ' + res.message);
    btnSave.disabled = false;
    btnSave.textContent = '保存';
  }
});
</script>
