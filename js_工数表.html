<script>
let appData = {};
let paramMap = {};

// 初期化
document.addEventListener('DOMContentLoaded', async () => {
  showStatus('データを読み込んでいます...');
  try {
    // サーバはJSON文字列を返す（オブジェクト直列化でnullになる事故を避けるため）
    const res = parseServerResult(await callServer('getAppData'));
    if (!res.ok) throw new Error(res.message);

    appData = res.data;
    // パラメータをマップ化（計算用）
    appData.params.forEach(p => paramMap[p['パラメータID']] = p['値']);
    renderTable();
    showStatus('読み込み完了');
    if (appData.works.length === 0) {
      showLoadError('作業データが0件です。スプレッドシートの「作業」「作業内訳」シートにデータがあるか、initSpreadsheet() を実行済みか確認してください。');
    }
  } catch (err) {
    // callServer は失敗時 {ok:false, message} または Error を reject する
    const msg = (err && err.message) ? err.message : JSON.stringify(err);
    console.error('getAppData failed:', err);
    showLoadError(msg);
  }

  // 絞り込みイベント
  document.getElementById('filter-btn').addEventListener('click', () => {
    renderTable(document.getElementById('filter-keyword').value);
  });
  document.getElementById('filter-clear-btn').addEventListener('click', () => {
    document.getElementById('filter-keyword').value = '';
    renderTable();
  });
  document.getElementById('filter-keyword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      renderTable(document.getElementById('filter-keyword').value);
    }
  });
});

// サーバ応答(JSON文字列)を解釈する
function parseServerResult(raw) {
  if (raw === null || raw === undefined) {
    throw new Error('サーバから応答がありません(null)。デプロイが古い可能性があります。');
  }
  return (typeof raw === 'string') ? JSON.parse(raw) : raw;
}

// 読込失敗時にエラーを表領域へ大きく表示
function showLoadError(msg) {
  const el = document.getElementById('app-content');
  el.innerHTML = `<div style="color:#c62828; background:#ffebee; border:1px solid #c62828; padding:16px; font-size:14px;">
    <b>データの読み込みに失敗しました</b><br><br>
    <code style="white-space:pre-wrap;">${msg}</code><br><br>
    確認事項: スクリプトプロパティ SPREADSHEET_ID / シートの存在 / 実行ユーザのアクセス権
  </div>`;
}

// テーブル描画
function renderTable(keyword = '') {
  const thead = document.querySelector('#works-table thead');
  const tbody = document.querySelector('#works-table tbody');
  
  // 表示項目を絞った簡易版ヘッダ
  const cols = ['作業名', '順序', '作業内訳名', '区分', '時間方式', '正味時間(現)', '数量方式', '固定数量', '人数(現)', '所要(分)', '工数(人・分)', '操作'];
  thead.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  
  tbody.innerHTML = '';
  
  const kw = keyword.toLowerCase().trim();

  // 状態が有効なものだけ抽出して表示
  const validWorks = appData.works.filter(w => w['状態'] === '有効');
  const validDetails = appData.details.filter(d => d['状態'] === '有効');

  let filteredWorks = validWorks;
  if (kw) {
    filteredWorks = validWorks.filter(work => {
      const workMatch = String(work['作業名']).toLowerCase().includes(kw);
      const detailMatch = validDetails.some(d => d['作業ID'] === work['作業ID'] && String(d['作業内訳名']).toLowerCase().includes(kw));
      return workMatch || detailMatch;
    });
  }

  filteredWorks.forEach(work => {
    // 作業（親）の行
    const trW = document.createElement('tr');
    trW.style.backgroundColor = '#e8f5e9';
    trW.innerHTML = `<td colspan="${cols.length - 1}"><b>${work['作業名']}</b> (作業ID: ${work['作業ID']})</td>
                     <td style="text-align: center;"><button class="btn-small add-btn">追加</button></td>`;
    tbody.appendChild(trW);

    trW.querySelector('.add-btn').addEventListener('click', () => addWorkDetailRow(work['作業ID'], null));

    // その作業に紐づく内訳
    let details = validDetails.filter(d => d['作業ID'] === work['作業ID']).sort((a,b) => a['順序'] - b['順序']);
    
    // 作業名でヒットしていない場合は、内訳名でヒットしたものだけに絞る
    if (kw && !String(work['作業名']).toLowerCase().includes(kw)) {
      details = details.filter(d => String(d['作業内訳名']).toLowerCase().includes(kw) || String(d['内訳ID']).toLowerCase().includes(kw));
    }
    
    details.forEach(detail => {
      // 即時計算
      const calc = calculateDetailClient(detail, appData.product['余裕率'], paramMap);
      
      const trD = document.createElement('tr');
      trD.dataset.id = detail['内訳ID'];
      // 基準値として編集開始時のデータをJSONで保持
      trD.dataset.baseRow = JSON.stringify(detail);
      
      // 確度の表示文字と色
      let accLabel = '未';
      let accColor = '#e0e0e0';
      if (detail['確度'] === '確定') { accLabel = '確'; accColor = '#81c784'; }
      else if (detail['確度'] === '暫定') { accLabel = '暫'; accColor = '#ffd54f'; }

      // 編集可能項目を input で生成
      trD.innerHTML = `
        <td><span style="display:inline-block; width:1.5em; height:1.5em; line-height:1.5em; text-align:center; background-color:${accColor}; border-radius:50%; font-size:0.8em;" title="${detail['確度']||'未観測'}">${accLabel}</span></td>
        <td><input type="number" name="順序" value="${detail['順序']}" class="edit-input" style="width:40px;"></td>
        <td><input type="text" name="作業内訳名" value="${detail['作業内訳名']}" class="edit-input long"></td>
        <td>
          <select name="区分" class="edit-input">
            <option ${detail['区分']=='実作業'?'selected':''}>実作業</option>
            <option ${detail['区分']=='手待ち'?'selected':''}>手待ち</option>
            <option ${detail['区分']=='段取り'?'selected':''}>段取り</option>
            <option ${detail['区分']=='間接作業'?'selected':''}>間接作業</option>
          </select>
        </td>
        <td>
          <select name="時間方式" class="edit-input">
            <option ${detail['時間方式']=='分担作業'?'selected':''}>分担作業</option>
            <option ${detail['時間方式']=='同時作業'?'selected':''}>同時作業</option>
          </select>
        </td>
        <td><input type="number" name="正味時間_現状" value="${detail['正味時間_現状']}" class="edit-input" step="0.1"></td>
        <td>
          <select name="数量方式" class="edit-input">
            <option ${detail['数量方式']=='固定'?'selected':''}>固定</option>
            <option ${detail['数量方式']=='パラメータ'?'selected':''}>パラメータ</option>
            <option ${detail['数量方式']=='部品の使用数'?'selected':''}>部品の使用数</option>
          </select>
        </td>
        <td><input type="number" name="固定数量" value="${detail['固定数量']}" class="edit-input"></td>
        <td><input type="number" name="人数_現状" value="${detail['人数_現状']}" class="edit-input"></td>
        <td class="calc-duration">${formatMin(calc.current.durationSec)}</td>
        <td class="calc-work">${formatMin(calc.current.workSec)}</td>
        <td style="white-space: nowrap;">
          <button class="btn-small parts-btn" title="部品の紐付け"><span style="font-size: 1.2em;">🔗</span></button>
          <button class="btn-small copy-btn" title="複製"><span style="font-size: 1.2em;">📋</span></button>
          <button class="btn-small save-btn" disabled>保存</button>
          <button class="btn-small disable-btn">無効</button>
        </td>
      `;
      tbody.appendChild(trD);
      
      // 変更検知イベント
      trD.querySelectorAll('.edit-input').forEach(input => {
        input.addEventListener('change', () => {
          input.classList.add('changed');
          trD.querySelector('.save-btn').disabled = false;
        });
        
        // F16: Tab/Enterでの移動対応 (簡易版)
        input.addEventListener('keydown', (e) => {
          if(e.key === 'Enter') {
            e.preventDefault();
            // 保存ボタンを押させるか、次のフィールドへ（ここではフォーカス移動をブラウザに任せる）
          }
        });
      });

      // 保存ボタン
      trD.querySelector('.save-btn').addEventListener('click', () => saveRow(trD, detail));
      
      // 複製ボタン
      trD.querySelector('.copy-btn').addEventListener('click', () => addWorkDetailRow(work['作業ID'], detail));

      // 部品ボタン
      trD.querySelector('.parts-btn').addEventListener('click', () => openPartsDialog(detail['内訳ID'], detail['作業内訳名']));

      // 無効化ボタン (F01)
      trD.querySelector('.disable-btn').addEventListener('click', () => {
        if(confirm('この作業内訳を無効化しますか？')) {
          const newRow = Object.assign({}, detail);
          newRow['状態'] = '無効';
          saveRowData(trD, newRow, detail, true);
        }
      });
    });
  });
}

// 行の保存処理
async function saveRow(tr, baseDetail) {
  const btn = tr.querySelector('.save-btn');
  btn.textContent = '保存中...';
  btn.disabled = true;

  // 画面の入力値から新しいRowオブジェクトを作成
  const newRow = Object.assign({}, baseDetail);
  tr.querySelectorAll('.edit-input').forEach(input => {
    newRow[input.name] = input.value;
  });

  await saveRowData(tr, newRow, baseDetail, false);
}

// サーバー通信
async function saveRowData(tr, newRow, baseDetail, isRemove) {
  showStatus('保存中...');
  let res;
  try {
    res = parseServerResult(await callServer('saveWorkDetail', newRow, baseDetail));
  } catch (err) {
    const msg = (err && err.message) ? err.message : JSON.stringify(err);
    showStatus('保存に失敗しました: ' + msg, true);
    tr.querySelector('.save-btn').textContent = '保存';
    tr.querySelector('.save-btn').disabled = false;
    return;
  }

  if (res.ok) {
    showStatus('保存完了');
    if (isRemove) {
      tr.remove(); // 画面から消す
    } else {
      tr.querySelectorAll('.edit-input').forEach(i => i.classList.remove('changed', 'conflict'));
      tr.querySelector('.save-btn').textContent = '保存';
      tr.dataset.baseRow = JSON.stringify(newRow); // 基準値を更新
      // 再計算して表示更新
      const calc = calculateDetailClient(newRow, appData.product['余裕率'], paramMap);
      tr.querySelector('.calc-duration').textContent = formatMin(calc.current.durationSec);
      tr.querySelector('.calc-work').textContent = formatMin(calc.current.workSec);
    }
  } else if (res.conflict) {
    alert(res.message + '\n画面をリロードするか、競合内容を確認してください。');
    tr.querySelector('.save-btn').textContent = '競合';
    tr.classList.add('conflict');
  } else {
    showStatus('保存に失敗しました: ' + res.message, true);
    tr.querySelector('.save-btn').textContent = '保存';
    tr.querySelector('.save-btn').disabled = false;
  }
}

// サーバー通信 (追加/複製)
async function addWorkDetailRow(workId, copySourceDetail) {
  showStatus('追加中...');
  let res;
  try {
    res = parseServerResult(await callServer('addWorkDetail', workId, copySourceDetail));
  } catch (err) {
    const msg = (err && err.message) ? err.message : JSON.stringify(err);
    alert('追加に失敗しました: ' + msg);
    showStatus('エラー発生', true);
    return;
  }

  if (res.ok) {
    showStatus('追加完了');
    appData.details.push(res.row);
    // 再描画
    renderTable(document.getElementById('filter-keyword').value);
  } else {
    alert('エラー: ' + res.message);
    showStatus('エラー発生');
  }
}

// 部品の紐付けダイアログを開く
function openPartsDialog(detailId, detailName) {
  // すでにダイアログがあれば削除
  let existingModal = document.getElementById('parts-modal');
  if (existingModal) existingModal.remove();

  // 現在の内訳に紐づく使用部品を取得
  let usedParts = appData.usedParts.filter(up => up['内訳ID'] === detailId && up['状態'] !== '無効');
  
  // HTML組み立て
  const modalHtml = `
    <div id="parts-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>部品の紐付け: ${detailName}</h3>
          <button class="modal-close" onclick="document.getElementById('parts-modal').remove()">×</button>
        </div>
        <div>
          <table class="modal-table" id="used-parts-table">
            <thead>
              <tr>
                <th>品番</th>
                <th>品名</th>
                <th>使用数</th>
                <th>数量基準</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${usedParts.map(up => {
                const part = appData.parts.find(p => p['品番'] === up['品番']) || { '品名': '不明' };
                return `
                  <tr data-part-id="${up['品番']}">
                    <td>${up['品番']}</td>
                    <td>${part['品名']}</td>
                    <td><input type="number" value="${up['使用数']}" style="width:40px;" class="used-qty-input"></td>
                    <td style="text-align:center;"><input type="radio" name="qty_base" value="${up['品番']}" ${up['数量基準'] ? 'checked' : ''}></td>
                    <td><button class="btn-small remove-part-btn">削除</button></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
          <div style="margin-top: 10px;">
            <input type="text" id="add-part-input" placeholder="品番を入力">
            <button id="add-part-btn">追加</button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-parts-btn">保存</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  // 追加ボタンのイベント
  document.getElementById('add-part-btn').addEventListener('click', () => {
    const partId = document.getElementById('add-part-input').value.trim();
    if (!partId) return;
    
    const part = appData.parts.find(p => p['品番'] === partId);
    if (!part) {
      alert('存在しない品番です: ' + partId);
      return;
    }
    
    // 既にあるかチェック
    const tbody = document.querySelector('#used-parts-table tbody');
    if (tbody.querySelector(`tr[data-part-id="${partId}"]`)) {
      alert('既に追加されています');
      return;
    }

    const tr = document.createElement('tr');
    tr.dataset.partId = partId;
    tr.innerHTML = `
      <td>${partId}</td>
      <td>${part['品名']}</td>
      <td><input type="number" value="1" style="width:40px;" class="used-qty-input"></td>
      <td style="text-align:center;"><input type="radio" name="qty_base" value="${partId}"></td>
      <td><button class="btn-small remove-part-btn">削除</button></td>
    `;
    tbody.appendChild(tr);
    document.getElementById('add-part-input').value = '';
  });

  // テーブル内のイベント（削除）
  document.getElementById('used-parts-table').addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-part-btn')) {
      e.target.closest('tr').remove();
    }
  });

  // 保存ボタンのイベント
  document.getElementById('save-parts-btn').addEventListener('click', async () => {
    const rows = document.querySelectorAll('#used-parts-table tbody tr');
    const newUsedParts = [];
    rows.forEach(tr => {
      newUsedParts.push({
        '内訳ID': detailId,
        '品番': tr.dataset.partId,
        '使用数': Number(tr.querySelector('.used-qty-input').value) || 1,
        '数量基準': tr.querySelector('input[name="qty_base"]').checked
      });
    });

    // 複数チェックや0件チェックなどのバリデーション（簡易）
    const bases = newUsedParts.filter(up => up['数量基準']);
    if (bases.length > 1) {
      alert('数量基準は1つしか選べません。');
      return;
    }

    showStatus('部品を保存中...');
    const saveBtn = document.getElementById('save-parts-btn');
    saveBtn.disabled = true;
    try {
      const res = parseServerResult(await callServer('saveUsedParts', detailId, newUsedParts));
      if (!res.ok) throw new Error(res.message);
      
      // 成功したらクライアントのデータを更新して閉じる
      appData.usedParts = appData.usedParts.filter(up => up['内訳ID'] !== detailId);
      appData.usedParts.push(...newUsedParts);
      document.getElementById('parts-modal').remove();
      showStatus('部品を保存しました');
    } catch (err) {
      alert('保存失敗: ' + err.message);
      // DOMツリーから消えていない場合のみdisabledを解除する (モーダルが閉じていない場合)
      if (document.getElementById('save-parts-btn')) {
        document.getElementById('save-parts-btn').disabled = false;
      }
      showStatus('エラー発生', true);
    }
  });
}
</script>
