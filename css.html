<style>
  body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f5f7; font-size: 13px; }
  .header { background: #333; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h2 { margin: 0; font-size: 16px; }
  #status-message { font-size: 12px; color: #ffeb3b; }
  
  .tab-container { background: #e0e0e0; padding: 5px 10px 0; }
  .tab-btn { background: #ccc; border: none; padding: 8px 16px; cursor: pointer; margin-right: 2px; border-radius: 4px 4px 0 0; }
  .tab-btn.active { background: #fff; font-weight: bold; }
  .tab-btn.disabled { opacity: 0.5; cursor: not-allowed; }
  
  #app-content { background: #fff; padding: 10px; overflow-x: auto; height: calc(100vh - 100px); }

  input[type="text"].long { width: 150px; }
  select { padding: 2px; }
  
  .changed { background-color: #e3f2fd; }
  .conflict { background-color: #ffebee; border: 2px solid red; }
  
  .btn-small { font-size: 11px; padding: 2px 6px; cursor: pointer; }
