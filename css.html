<style>
  body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f5f7; font-size: 13px; }
  .header { background: #333; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h2 { margin: 0; font-size: 16px; }
  #status-message { font-size: 12px; color: #ffeb3b; }
  
  .tab-container { background: #e0e0e0; padding: 5px 10px 0; }
  .tab-btn { background: #ccc; border: none; padding: 8px 16px; cursor: pointer; margin-right: 2px; border-radius: 4px 4px 0 0; }
  .tab-btn.active { background: #fff; font-weight: bold; }
  .tab-btn.disabled { opacity: 0.5; cursor: not-allowed; }
  
  #app-content { background: #fff; padding: 10px; overflow-x: auto; height: calc(100vh - 100px); }
  
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  th { background: #f0f0f0; position: sticky; top: 0; z-index: 1; }
  
  input[type="text"], input[type="number"] { width: 60px; padding: 2px; border: 1px solid #ccc; }
  input[type="text"].long { width: 150px; }
  select { padding: 2px; }
  
  .changed { background-color: #e3f2fd; }
  .conflict { background-color: #ffebee; border: 2px solid red; }
  
  .btn-small { font-size: 11px; padding: 2px 6px; cursor: pointer; }

  /* モーダルダイアログ用 */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 1000;
    display: flex; justify-content: center; align-items: center;
  }
  .modal-content {
    background: #fff; padding: 20px; border-radius: 4px;
    min-width: 500px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px;
  }
  .modal-header h3 { margin: 0; }
  .modal-close { cursor: pointer; font-size: 1.5em; border: none; background: none; }
  .modal-footer {
    display: flex; justify-content: flex-end;
    border-top: 1px solid #ddd; padding-top: 10px; margin-top: 10px;
  }
  .modal-table { width: 100%; margin-bottom: 10px; }
  .modal-table th, .modal-table td { padding: 4px; }
</style>
